name: GitGlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Package smoke test
        run: npm pack --dry-run

      - name: CLI smoke tests
        run: |
          node dist/index.js --help
          node dist/index.js commit --help
          node dist/index.js scan --help
          node dist/index.js pr --help
